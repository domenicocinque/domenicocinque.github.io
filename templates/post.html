<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>$title$ — Domenico Cinque</title>
        <link rel="stylesheet" href="../../styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
        />
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"
        ></script>
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
        />
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    </head>
    <body>
        <div class="wrap">
            <header class="site-header">
                <div class="site-header__inner">
                    <a class="site-title" href="/index.html">Domenico Cinque</a>
                    <nav class="site-nav">
                        <a class="nav-link is-active" href="/index.html">Blog</a>
                        <a class="nav-link" href="/about.html">About</a>
                    </nav>
                </div>
            </header>

            <article>
                <h1>$title$</h1>
$if(date)$
                <div class="meta">$date$</div>
$endif$
$body$
            </article>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                hljs.highlightAll();
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: "$$$$", right: "$$$$", display: true },
                        { left: "\\[", right: "\\]", display: true },
                        { left: "$$", right: "$$", display: false },
                        { left: "\\(", right: "\\)", display: false },
                    ],
                });
            });
        </script>
    </body>
</html>
